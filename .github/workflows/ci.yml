name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Build first: the MCP worker tests exercise the real ASSETS path by
      # reading dist/, and skip themselves when it is absent.
      - run: bun run build
      - run: bun run test
