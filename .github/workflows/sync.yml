name: Sync upstream releases

# Upstream ships roughly monthly, so this is quiet by design: on most days the
# ingest finds nothing, `data/` is byte-identical, and the job ends without
# opening anything.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Ingest new releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run ingest

      - name: Detect changes
        id: changed
        run: |
          if git diff --quiet -- data; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "versions=$(git diff --name-only -- data | grep '\.json\.gz$' | sed 's#data/##; s#/#  v#; s#\.json\.gz##' | paste -sd', ' -)" >> "$GITHUB_OUTPUT"
          fi

      # Build first: the MCP worker tests read dist/. The tests assert against
      # real releases, so a new snapshot that breaks them means a normalizer no
      # longer understands upstream - the PR should exist and fail loudly rather
      # than not exist at all.
      - name: Build and test
        id: test
        if: steps.changed.outputs.any == 'true'
        run: bun run build && bun run test
        continue-on-error: true

      # The org disallows GitHub Actions from opening pull requests, so the job
      # pushes a branch and files an issue with a compare link instead. Same
      # review gate, one extra click: nothing lands on main without a human
      # looking at the diff.
      - name: Push branch
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync/upstream
          git add data
          git commit -m "data: ingest ${{ steps.changed.outputs.versions }}"
          git push --force origin sync/upstream

      - name: File an issue
        if: steps.changed.outputs.any == 'true'
        uses: actions/github-script@v7
        env:
          VERSIONS: ${{ steps.changed.outputs.versions }}
          TESTS: ${{ steps.test.outcome }}
        with:
          script: |
            const versions = process.env.VERSIONS
            const passed = process.env.TESTS === "success"
            const compare = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/compare/main...sync/upstream`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream released ${versions}`,
              labels: ["upstream-sync"],
              body: [
                `New upstream data is on \`sync/upstream\`: ${compare}`,
                "",
                passed
                  ? "Tests passed against the new snapshots."
                  : "**Tests failed against the new snapshots.** Upstream has changed a model, a document layout or the proto grammar in a way a normalizer does not yet understand. Merging as-is would publish wrong history — fix the normalizer first.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
            })

  # A silent scheduled job is indistinguishable from a broken one, so failure
  # has to surface somewhere a human looks.
  notify:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Upstream sync failed"
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "sync-failure",
            })
            if (issues.some((issue) => issue.title === title)) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["sync-failure"],
              body: `The scheduled ingest failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
